[project]
name = "silent-claim-api"
version = "0.1.0"
description = "Silent Claim backend API, detector rules, and evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
